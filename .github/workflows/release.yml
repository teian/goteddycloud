name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to retry GHCR publishing
        required: true
        type: string
      source_ref:
        description: Optional CI-verified commit to rebuild this image tag (native release assets stay unchanged)
        required: false
        type: string

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name == 'release'
    uses: ./.github/workflows/check.yml

  assets:
    name: Native binaries and Linux packages
    needs: checks
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: go1.26.8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
      - name: Check release version
        run: |
          version=$(cat VERSION)
          if [ "$RELEASE_TAG" != "v$version" ] && [ "$RELEASE_TAG" != "$version" ]; then
            echo 'The release tag must match VERSION.' >&2
            exit 1
          fi
      - name: Install pinned Linux packager
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      - name: Install package inspection tools
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - name: Build release files
        run: >-
          python3 scripts/build-release.py "$RELEASE_TAG"
          --out dist/release --packages --repository "$GITHUB_REPOSITORY"
      - name: Check native server and standalone tool
        run: |
          python3 scripts/release-smoke.py dist/release "$RELEASE_TAG"
          python3 scripts/native-smoke.py --binary "dist/release/goteddycloud-$RELEASE_TAG-linux-amd64/goteddycloud"
          "dist/release/cc3200tool-$RELEASE_TAG-linux-amd64/cc3200tool" --help
          cd dist/release
          sha256sum --check SHA256SUMS
      - name: Build and run both Nix packages
        run: |
          mkdir -p "$RUNNER_TEMP/nix-release"
          tar -xzf "dist/release/goteddycloud-$RELEASE_TAG-nix.tar.gz" \
            -C "$RUNNER_TEMP/nix-release" --strip-components=1
          docker run --rm --entrypoint sh \
            -v "$RUNNER_TEMP/nix-release:/package:ro" \
            -v "$PWD/dist/release:/release:ro" -e RELEASE_TAG \
            nixos/nix@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c \
            -c 'set -eu
              for program in goteddycloud cc3200tool; do
                package=$(nix-build /package/default.nix --argstr program "$program" \
                  --arg source "/release/$program-$RELEASE_TAG-linux-amd64.tar.gz" \
                  --no-out-link --option sandbox false)
                if [ "$program" = goteddycloud ]; then
                  "$package/bin/$program" -version
                else
                  "$package/bin/$program" --help
                fi
              done'
      - name: Upload binaries, packages and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          assets = sorted(str(p) for p in Path('dist/release').iterdir() if p.is_file())
          subprocess.run(['gh', 'release', 'upload', os.environ['RELEASE_TAG'],
                          *assets, '--repo', os.environ['GITHUB_REPOSITORY'], '--clobber'], check=True)
          PY

  docker:
    name: Multi-platform GHCR image
    needs: [checks, assets]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.checks.result == 'success' && needs.assets.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out image sources
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || env.RELEASE_TAG }}
          path: .cache/release-docker-source
          persist-credentials: false
      - name: Validate the release and retry prerequisites
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          latest=false
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = false ]; then
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$RELEASE_TAG" ]; then
              latest=true
            fi
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          version=$(cat .cache/release-docker-source/VERSION)
          if [ "$RELEASE_TAG" != "v$version" ] && [ "$RELEASE_TAG" != "$version" ]; then
            echo 'The release tag must match VERSION in the released sources.' >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            sha=$(git -C .cache/release-docker-source rev-parse HEAD)
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yml \
              --commit "$sha" --event push --status success --limit 1 \
              --json databaseId --jq length)
            test "$passed" -gt 0
          fi
      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm,arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Select GHCR image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and OCI labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.licenses=GPL-2.0-only
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
      - name: Build all architectures for inspection
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .cache/release-docker-source
          target: ffmpeg
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/release-images.tar
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=release-docker
          cache-to: type=gha,scope=release-docker,mode=max
          provenance: mode=max
          sbom: true
      - name: Verify the executables match the platform manifests
        run: python3 scripts/check-container-architectures.py "$RUNNER_TEMP/release-images.tar"
      - name: Load the native image for a startup test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .cache/release-docker-source
          target: ffmpeg
          platforms: linux/amd64
          load: true
          tags: goteddycloud:release-test
          build-args: VERSION=${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=release-docker
      - name: Check native container startup and FFmpeg
        run: |
          docker run --rm goteddycloud:release-test -base_path /data \
            -http :18080 -httpsecure :18443 -box :18444 -docker-test
          docker run --rm --entrypoint ffmpeg goteddycloud:release-test -version
      - name: Check bundled Web UI with a volume and an empty host mount
        run: python3 scripts/container-webui-smoke.py --image goteddycloud:release-test
      - name: Publish verified architecture builds
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .cache/release-docker-source
          target: ffmpeg
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=release-docker
          cache-to: type=gha,scope=release-docker,mode=max
          provenance: mode=max
          sbom: true
