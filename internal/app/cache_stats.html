<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="refresh" content="1"><title>Cache Statistics</title><style>body { font-family: Arial, sans-serif; background-color: #f4f4f4; color: #333; }h1 { color: #444; text-align: center; }.container { max-width: 800px; margin: 50px auto; padding: 20px; background-color: #fff; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }table { width: 100%%; border-collapse: collapse; margin-top: 20px; }th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }th { background-color: #f2f2f2; }.btn { display: inline-block; padding: 10px 20px; font-size: 16px; color: #fff; background-color: #007bff; border: none; border-radius: 5px; text-decoration: none; margin-top: 20px; }</style><script>function flushCache() {  fetch('/api/cacheFlush', { method: 'POST' })    .then(response => response.json())    .then(data => {      alert(data.message + ' Number of files deleted: ' + data.deleted_files);      location.reload();    })    .catch(error => {      console.error('Error flushing cache:', error);      alert('Failed to flush cache.');    });}</script></head><body><div class="container"><h1>Cache Statistics</h1><table><tr><th>Total Entries</th><td>%d</td></tr><tr><th>Entries with Existing Files</th><td>%d</td></tr><tr><th>Total Cached Files</th><td>%d</td></tr><tr><th>Total Cache Size</th><td>%d bytes</td></tr><tr><th>Memory Used</th><td>%d bytes</td></tr></table><button class="btn" onclick="flushCache()">Flush Cache</button></div></body></html>
